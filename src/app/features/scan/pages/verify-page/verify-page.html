<app-state-screen [loading]="store.loading()" [error]="store.loadError()" (retry)="resolve()">
  @if (store.garment(); as garment) {
    <section class="verify">
      <span class="app-badge" aria-hidden="true"><i class="pi pi-lock"></i></span>
      <h1 class="app-heading" i18n="@@verify.title">Bu futbolka haqiqiy</h1>
      <p class="app-lead" i18n="@@verify.lead">
        Futbolka allaqachon aktivatsiya qilingan. Pasport faqat egasiga ko'rinadi.
      </p>
      <app-garment-preview
        [garment]="garment"
        [registration]="store.registration()"
        [compact]="true"
      />
    </section>
  }
</app-state-screen>
