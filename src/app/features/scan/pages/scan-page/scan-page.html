<app-state-screen [loading]="store.loading()" [error]="store.loadError()" (retry)="resolve()">
  @switch (store.state()) {
    @case ('unclaimed') {
      @if (store.garment(); as garment) {
        <section class="scan">
          <app-garment-preview [garment]="garment" />
          <h1 class="app-heading" i18n="@@scan.unclaimed.title">
            Futbolkangiz aktivatsiya kutmoqda
          </h1>
          <p class="app-lead" i18n="@@scan.unclaimed.lead">
            Ro'yxatdan o'ting va bu futbolkaning raqamli pasportini oching.
          </p>
        </section>

        <div class="app-action-bar">
          <a
            [routerLink]="registerUrl()"
            [queryParams]="{ returnUrl: returnUrl() }"
            class="app-button app-button--primary"
            i18n="@@scan.unclaimed.register"
          >
            Ro'yxatdan o'tish
          </a>
          <a
            [routerLink]="loginUrl()"
            [queryParams]="{ returnUrl: returnUrl() }"
            class="app-button app-button--ghost"
            i18n="@@scan.unclaimed.login"
          >
            Akkauntim bor
          </a>
        </div>
      }
    }
    @case ('invalid') {
      @if (store.invalidReason(); as reason) {
        <app-invalid-link [reason]="reason" />
      }
    }
  }
</app-state-screen>
