<app-state-screen [loading]="store.loading()" [error]="store.loadError()" (retry)="load()">
  @if (store.passport(); as passport) {
    @switch (tab()) {
      @case ('card') {
        <app-passport-book [(opened)]="opened">
          <ng-container bookCover>
            <span class="cover__brand" i18n="@@layout.brand">PEAKTOFAN</span>
            <span class="cover__middle">
              <app-logo class="cover__emblem" />
              <h1 class="cover__title" i18n="@@passport.cover.title">RAQAMLI PASPORT</h1>
              @if (holder()) {
                <span class="cover__holder">{{ holder() }}</span>
              }
              @if (store.locked()) {
                <span class="cover__locked" i18n="@@passport.locked">Muddati tugagan</span>
              }
            </span>
            <span class="cover__serial app-mono">{{ passport.garment.serialNumber }}</span>
          </ng-container>

          <app-passport-card [passport]="passport" [level]="level()" />
        </app-passport-book>
      }
      @case ('shirt') {
        <app-passport-shirt [passport]="passport" [now]="openedAt" />
      }
      @case ('profile') {
        <app-passport-profile [holder]="holder()" />
      }
    }

    @if (opened()) {
      <app-passport-tabs [options]="tabOptions" [(active)]="tab" />
    }
  }
</app-state-screen>
